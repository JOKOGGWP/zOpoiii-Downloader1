name: Build zOpoiii Downloader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          set -e

          echo "=== REPOSITORY ==="
          pwd
          ls -lah

          echo ""
          echo "=== ZIP FILES ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Find and extract project ZIP
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "Project ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "=== EXTRACTED PROJECT ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect project root
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          FOUND=$(find project -mindepth 1 -maxdepth 3 \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$FOUND" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            find project -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$FOUND")

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        run: |
          set -e

          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        run: |
          set -e

          SDK="$ANDROID_HOME"

          if [ ! -d "$SDK/platforms/android-36" ]; then
            sdkmanager "platforms;android-36"
          fi

          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            sdkmanager "build-tools;36.0.0"
          fi

          echo "=== ANDROID SDK ==="
          ls -lah "$SDK/platforms"
          ls -lah "$SDK/build-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -lah

          echo ""
          echo "=== APP ==="
          ls -lah app

          echo ""
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "libs.versions.toml" \
            \) \
            -print

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle clean assembleDebug \
            -x processDebugGoogleServices \
            --stacktrace \
            --no-daemon \
            --console=plain \
            2>&1 | tee build.log

      - name: Diagnose resource failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo ""
          echo "=========================================="
          echo "RESOURCE BUILD ERROR"
          echo "=========================================="

          echo ""
          echo "=== AAPT / RESOURCE ERRORS ==="

          grep -i -E \
            -A 20 -B 10 \
            "AAPT|resource .* not found|error:.*resource|Android resource linking failed|failed linking references|processDebugResources" \
            build.log || true

          echo ""
          echo "=== ALL ERROR LINES ==="

          grep -i -E \
            "error:|ERROR:|FAILED|FAILURE|Caused by:" \
            build.log | tail -300 || true

          echo ""
          echo "=== FAILED TASK ==="

          grep -i -A 30 -B 10 \
            "> Task .* FAILED" \
            build.log || true

          echo ""
          echo "=== LAST 250 LINES ==="

          tail -250 build.log

      - name: Find APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== GENERATED APK ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
