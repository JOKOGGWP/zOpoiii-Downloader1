name: Build zOpoiii Downloader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "=== REPOSITORY ==="
          pwd
          ls -lah

          echo ""
          echo "=== ZIP FILES ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Find and extract project ZIP
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "Project ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "=== EXTRACTED PROJECT ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect project root
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=project"
            exit 0
          fi

          FOUND=$(find project -mindepth 1 -maxdepth 3 \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$FOUND" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            find project -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$FOUND")

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo ""
          echo "=== SDK DIRECTORIES ==="
          ls -lah "$SDK"

      - name: Install Android SDK packages
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK PACKAGES"
          echo "=========================================="

          echo ""
          echo "=== INSTALLED PLATFORMS ==="
          ls -lah "$SDK/platforms" 2>/dev/null || true

          echo ""
          echo "=== INSTALLED BUILD TOOLS ==="
          ls -lah "$SDK/build-tools" 2>/dev/null || true

          echo ""
          echo "=== CHECK REQUIRED SDK ==="

          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "Android 36 belum tersedia."

            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses || true
              sdkmanager "platforms;android-36"
            else
              echo "ERROR: sdkmanager tidak tersedia."
              exit 1
            fi
          fi

          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            echo "Build Tools 36.0.0 belum tersedia."

            if command -v sdkmanager >/dev/null 2>&1; then
              sdkmanager "build-tools;36.0.0"
            else
              echo "ERROR: sdkmanager tidak tersedia."
              exit 1
            fi
          fi

          echo ""
          echo "=== FINAL SDK ==="
          ls -lah "$SDK/platforms"
          ls -lah "$SDK/build-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "PROJECT:"
          pwd

          echo ""
          echo "FILES:"
          ls -lah

          echo ""
          echo "APP:"
          ls -lah app

          echo ""
          echo "GRADLE FILES:"
          find . -maxdepth 3 \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "libs.versions.toml" \
            \) \
            -print

      - name: Check Gradle
        run: |
          gradle --version

      - name: Inspect dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            --console=plain \
            > dependencies.log 2>&1 || true

          echo "=== DEPENDENCIES ==="
          cat dependencies.log

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILD APK"
          echo "=========================================="

          gradle clean assembleDebug \
            -x processDebugGoogleServices \
            --stacktrace \
            --info \
            --no-daemon \
            --console=plain 2>&1 | tee build.log

      - name: Diagnose build failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD FAILURE"
          echo "=========================================="

          echo ""
          echo "=== DUPLICATE CLASS ==="

          grep -i -A 20 -B 10 \
            "Duplicate class" build.log || true

          echo ""
          echo "=== FAILED TASK ==="

          grep -i -A 15 -B 10 \
            "> Task .* FAILED" build.log || true

          echo ""
          echo "=== ERRORS ==="

          grep -i -E \
            "error:|ERROR:|FAILURE|FAILED|Caused by:" \
            build.log | tail -250 || true

          echo ""
          echo "=== LAST 200 LINES ==="

          tail -200 build.log

      - name: Find APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
