name: Build zOpoiii Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find ZIP project
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            echo
            echo "Isi repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # EXTRACT PROJECT
      # ============================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

          echo "Project berhasil diekstrak."
          echo

          find project -maxdepth 3 -type f | head -100


      # ============================================================
      # DETECT GRADLE PROJECT
      # ============================================================

      - name: Detect Gradle project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || \
             [ -f "project/settings.gradle" ]; then

            PROJECT_DIR="project"

          else

            SETTINGS=$(find project \
              -maxdepth 5 \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle(.kts) tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")

          fi

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then

            SDK="/usr/local/lib/android/sdk"

          elif [ -n "$ANDROID_SDK_ROOT" ] && \
               [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK="$ANDROID_SDK_ROOT"

          elif [ -n "$ANDROID_HOME" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK="$ANDROID_HOME"

          else

            echo "ERROR: Android SDK tidak ditemukan."
            exit 1

          fi

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi


      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Android platforms:"
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Android build tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools" || true


      # ============================================================
      # INSTALL ANDROID 36 IF NEEDED
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then

            echo "sdkmanager ditemukan."

            if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then

              echo "Installing Android Platform 36..."

              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

              "$SDKMANAGER" "platforms;android-36"

            else

              echo "Android Platform 36 sudah tersedia."

            fi


            if [ ! -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then

              echo "Installing Build Tools 36.0.0..."

              "$SDKMANAGER" "build-tools;36.0.0"

            else

              echo "Build Tools 36.0.0 sudah tersedia."

            fi

          else

            echo "sdkmanager tidak tersedia."
            echo "Menggunakan SDK bawaan GitHub runner."

          fi


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true


      # ============================================================
      # VERIFY JAVA / GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version


      # ============================================================
      # INSPECT PROJECT
      # ============================================================

      - name: Inspect project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo
          echo "Gradle files:"

          find . \
            -maxdepth 3 \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "libs.versions.toml" \
            \) \
            -print | sort


      # ============================================================
      # TEMPORARY GOOGLE SERVICES
      #
      # ZIP TIDAK DIUBAH.
      # FILE HANYA DIBUAT DI RUNNER GITHUB.
      # ============================================================

      - name: Create temporary google-services.json
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p app

          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "zopoiii-downloader-build",
              "storage_bucket": "zopoiii-downloader-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.zopoiii.downloader"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

          echo "Temporary google-services.json berhasil dibuat."

          ls -lh app/google-services.json


      # ============================================================
      # FIX SIGNING
      #
      # ERROR SEBELUMNYA:
      #
      # :app:validateSigningDebug
      # debug.keystore not found
      #
      # File dibuat langsung di GitHub runner.
      # ZIP ASLI TIDAK DIUBAH.
      # ============================================================

      - name: Generate debug.keystore
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          KEYSTORE="$PWD/debug.keystore"

          echo "Checking debug keystore..."

          if [ -f "$KEYSTORE" ]; then

            echo "debug.keystore sudah ada."
            ls -lh "$KEYSTORE"

          else

            echo "debug.keystore tidak ditemukan."
            echo "Membuat debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo
            echo "debug.keystore berhasil dibuat."

            ls -lh "$KEYSTORE"

          fi


      # ============================================================
      # VERIFY SIGNING FILE
      # ============================================================

      - name: Verify debug signing
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Checking debug.keystore..."

          if [ ! -f "debug.keystore" ]; then
            echo "ERROR: debug.keystore masih tidak ditemukan."
            exit 1
          fi

          keytool \
            -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

          echo
          echo "DEBUG KEYSTORE OK."


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --console=plain


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        id: build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo
          echo "========================================"
          echo "BUILD zOpoiii DOWNLOADER"
          echo "========================================"
          echo

          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"


      # ============================================================
      # DIAGNOSTIC JIKA BUILD GAGAL
      # ============================================================

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |

          echo
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/build.log" ]; then

            echo "build.log tidak tersedia."
            echo "Build gagal sebelum log build dibuat."

          else

            echo
            echo "========================================"
            echo "FAILURE"
            echo "========================================"

            grep -n -i -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "SIGNING ERRORS"
            echo "========================================"

            grep -n -i -E \
              "signing|keystore|validateSigning|storepass|keypass" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "GOOGLE SERVICES ERRORS"
            echo "========================================"

            grep -n -i -E \
              "google-services|api_key|current_key|google_app_id|project_number" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "RESOURCE / AAPT ERRORS"
            echo "========================================"

            grep -n -i -E \
              "AAPT|Android resource linking failed|failed linking references|resource .* not found" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "KOTLIN / JAVA ERRORS"
            echo "========================================"

            grep -n -i -E \
              "Kotlin.*error|e: .*\.kt:|Compilation error|Java.*error|error: .*\.java" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "DEPENDENCY ERRORS"
            echo "========================================"

            grep -n -i -E \
              "Resource missing|Could not resolve|Could not find|Could not GET|Could not HEAD|HTTP [45][0-9][0-9]|timeout|SSL|PKIX" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "DUPLICATE CLASS ERRORS"
            echo "========================================"

            grep -n -i -E \
              "Duplicate class|duplicate classes" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -200 || true


            echo
            echo "========================================"
            echo "LAST 400 LINES"
            echo "========================================"

            tail -400 "$GITHUB_WORKSPACE/build.log"

          fi


      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |

          echo
          echo "========================================"
          echo "APK HASIL BUILD"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
