name: Build zOpoiii Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP project
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Detect Gradle project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || \
             [ -f "project/settings.gradle" ]; then
            PROJECT_DIR="project"
          else
            SETTINGS=$(find project -maxdepth 5 \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle(.kts) tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Platforms:"
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Build tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then

            if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
              echo "Installing Android 36..."
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "platforms;android-36"
            else
              echo "Android 36 already installed."
            fi

            if [ ! -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
              echo "Installing Build Tools 36.0.0..."
              "$SDKMANAGER" "build-tools;36.0.0"
            else
              echo "Build Tools 36.0.0 already installed."
            fi

          else
            echo "sdkmanager tidak tersedia."
            echo "Menggunakan Android SDK bawaan runner."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Verify Java and Gradle
        shell: bash
        run: |
          java -version
          echo
          gradle --version

      - name: Verify project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print | sort

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --console=plain

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD zOpoiii DOWNLOADER"
          echo "========================================"

          gradle assembleDebug \
            -x processDebugGoogleServices \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/build.log" ]; then
            echo "build.log tidak ditemukan."
            exit 0
          fi

          echo
          echo "===== FAILURE ====="

          grep -n -i -E \
            "FAILURE:|What went wrong:|Execution failed|Caused by:" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -100 || true

          echo
          echo "===== ERRORS ====="

          grep -n -i -E \
            "error:|ERROR|AAPT|Android resource linking failed|failed linking references|Duplicate class|Could not resolve|Could not find|Compilation failed" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -200 || true

          echo
          echo "===== LAST 400 LINES ====="

          tail -400 "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Find APK
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "APK:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
