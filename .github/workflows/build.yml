name: Build zOpoiii Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP project
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            echo "Isi repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

          echo "Isi project:"
          find project -maxdepth 3 -type f | head -100

      - name: Detect Gradle project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            PROJECT_DIR="project"
          else
            SETTINGS=$(find project -maxdepth 4 \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle(.kts) tidak ditemukan."
              find project -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "Android SDK ditemukan."
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK: $ANDROID_SDK_ROOT"
          else
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Installed SDK platforms:"
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Installed build tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Install Android SDK 36 if needed
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
              echo "Installing Android platform 36..."
              yes | "$SDKMANAGER" --licenses >/dev/null || true
              "$SDKMANAGER" "platforms;android-36"
            fi

            if [ ! -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
              echo "Installing Build Tools 36.0.0..."
              "$SDKMANAGER" "build-tools;36.0.0"
            fi
          else
            echo "sdkmanager tidak tersedia. Menggunakan SDK yang sudah terpasang."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Show Gradle environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Project:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "libs.versions.toml" \) \
            -print | sort

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          gradle clean assembleDebug \
            -x processDebugGoogleServices \
            --stacktrace \
            --info \
            --no-daemon \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Diagnose build failure
        if: failure()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BUILD FAILED - DIAGNOSTIC"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/build.log" ]; then
            echo "build.log tidak ditemukan."
            exit 0
          fi

          echo
          echo "===== GRADLE ERROR LINES ====="

          grep -n -i -E \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|ERROR|AAPT|Android resource linking failed|failed linking references|Duplicate class|Could not resolve|Could not find|Permission denied|Compilation failed" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -200 || true

          echo
          echo "===== RESOURCE ERRORS ====="

          grep -n -i -E -A 25 -B 15 \
            "AAPT|Android resource linking failed|failed linking references|resource .* not found|error: resource" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -300 || true

          echo
          echo "===== DUPLICATE CLASS ERRORS ====="

          grep -n -i -E -A 15 -B 5 \
            "Duplicate class|duplicate classes" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -200 || true

          echo
          echo "===== DEPENDENCY ERRORS ====="

          grep -n -i -E -A 15 -B 5 \
            "Could not resolve|Could not find|failed to resolve|dependency" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -200 || true

          echo
          echo "===== LAST 300 LOG LINES ====="

          tail -300 "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Find APK
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "APK hasil build:"

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader-debug
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
