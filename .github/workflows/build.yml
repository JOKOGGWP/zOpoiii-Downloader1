name: Build zOpoiii Downloader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "=== Repository ==="
          ls -lah

          echo ""
          echo "=== ZIP files ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Find and extract project ZIP
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            echo ""
            echo "Isi repository:"
            ls -lah
            exit 1
          fi

          echo "Project ZIP ditemukan:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "=== Extract selesai ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect project root
        run: |
          set -e

          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          FOUND=$(find project -mindepth 1 -maxdepth 3 \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$FOUND" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            find project -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$FOUND")

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT ROOT ==="
          pwd

          echo ""
          echo "=== PROJECT FILES ==="
          ls -lah

          echo ""
          echo "=== APP DIRECTORY ==="

          if [ -d "app" ]; then
            ls -lah app
          else
            echo "ERROR: app directory tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "=== GRADLE FILES ==="

          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "libs.versions.toml" \) \
            -print

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean assembleDebug \
            -x processDebugGoogleServices \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== GENERATED APK ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
